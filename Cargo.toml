[package]
name = "axis_bot_studio"
description = "A small desktop app that runs an Axis Discord bot: paste a token, set up commands, watch it live"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

# Independent from the library workspace: this crate pulls in the GUI
# stack (eframe), which needs system windowing libraries. Build with
# `cargo build --release` in this directory.

# Empty workspace table: detach from the parent library workspace.
[workspace]

[dependencies]
axis = { path = "../crates/axis" }
axis-commands = { path = "../crates/axis-commands" }
eframe = { version = "0.33", default-features = false, features = [
    "glow",
    "default_fonts",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
egui = "0.33"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }
