[package]
name = "axis_agents"
description = "Run a team of autonomous AI agents on Discord: each agent is its own bot, with memory, tools, and a shared coordination channel"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/uvxszi/axis-agents"

[[bin]]
name = "axis_agents"
path = "src/main.rs"

[dependencies]
# The Axis Discord library and its voice add-on, from GitHub (pinned in
# Cargo.lock; `cargo update -p axis -p axis-voice` takes newer commits).
axis = { git = "https://github.com/uvxszi/axis" }
axis-commands = { git = "https://github.com/uvxszi/axis" }
axis-voice = { git = "https://github.com/uvxszi/axis-voice" }
eframe = { version = "0.33", default-features = false, features = [
    "glow",
    "default_fonts",
] }
egui = "0.33"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "net", "fs"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
ab_glyph = "0.2"
epaint_default_fonts = "0.33"
fastrand = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

# Audio and encryption run 50 times a second; keep them fast in debug builds.
[profile.dev.package.unsafe-libopus]
opt-level = 3
[profile.dev.package.davey]
opt-level = 3
[profile.dev.package.openmls]
opt-level = 3
[profile.dev.package.aes-gcm]
opt-level = 3
[profile.dev.package.axis-voice]
opt-level = 2
